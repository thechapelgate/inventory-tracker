<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CareStock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with facility + tabs; one working pane per tab; tables scroll inside their own frame. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E9EDEB; --line:#D5DCD9; --ink:#15211D; --muted:#5B6964;
  --accent:#1F6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6;
  --ok:#2E7D4F; --ok-soft:#E1F2E7; --warn:#A86500; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE3E1; --info:#2B5C8A; --info-soft:#E2ECF6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --sunk:#1C2824; --line:#2A3833; --ink:#E4ECE8; --muted:#94A39D;
  --accent:#5CC4A3; --accent-ink:#0B1411; --accent-soft:#1D3A31;
  --ok:#6FCF97; --ok-soft:#163222; --warn:#F2B552; --warn-soft:#3A2B10; --bad:#F2867E; --bad-soft:#3C1A18; --info:#86B6E6; --info-soft:#18293A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --sunk:#1C2824; --line:#2A3833; --ink:#E4ECE8; --muted:#94A39D;
  --accent:#5CC4A3; --accent-ink:#0B1411; --accent-soft:#1D3A31;
  --ok:#6FCF97; --ok-soft:#163222; --warn:#F2B552; --warn-soft:#3A2B10; --bad:#F2867E; --bad-soft:#3C1A18; --info:#86B6E6; --info-soft:#18293A;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0}
.brand h1{font:700 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand .fac{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a .count{font:500 11px var(--f-mono);background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 6px;margin-left:6px}
main{padding-block:20px 60px;display:grid;gap:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.banner{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner p{margin:0;flex:1 1 260px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font:600 26px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}
.meter{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font:700 17px/1.2 var(--f-display);margin:0 0 4px;text-wrap:balance}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.list{display:grid}
.row-att{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row-att:first-child{border-top:0}
.row-att .nm{font-weight:600}
.row-att .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-low{background:var(--warn-soft);color:var(--warn)}.p-out,.p-expired{background:var(--bad-soft);color:var(--bad)}.p-expiring{background:var(--info-soft);color:var(--info)}.p-over{background:var(--sunk);color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
.toolbar select{width:auto}
.tbl-frame{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;background:var(--sunk);white-space:nowrap;cursor:default}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12px;color:var(--muted)}
tr.st-out td:first-child,tr.st-expired td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.st-low td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.st-expiring td:first-child{box-shadow:inset 3px 0 0 var(--info)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 17px var(--f-display);margin-bottom:4px}
.supplier{display:grid;gap:8px}
.supplier + .supplier{margin-top:18px}
.supplier-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.supplier-hd h3{margin:0;font:700 16px var(--f-display)}
.save-tag{font-size:12px;color:var(--ok);font-weight:600}
.opps{display:grid;gap:10px}
.opp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.opp .tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.opp .t{font-weight:600}
.opp .d{font-size:13.5px;color:var(--muted)}
.opp .amt{font:600 18px var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.opp .amt small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.big-save{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline}
.big-save .v{font:700 40px/1 var(--f-display);color:var(--ok);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgb(10 16 14 / .45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);padding:20px;display:grid;gap:14px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.modal h3{margin:0;font:700 19px var(--f-display)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f small{font-weight:400}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-acts .spacer{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 1 auto;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked + span{color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30}
.note{font-size:13px;color:var(--muted)}
.status-line{font-size:13px;color:var(--muted);padding:6px 0}
.modal.wide{width:min(1040px,100%)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:96px;height:120px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700;line-height:1}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.rv td{vertical-align:top}
.rv input,.rv select{padding:5px 7px;font-size:13.5px}
.rv input[type=number]{width:90px;text-align:right}
.rv tr.skip td{opacity:.45}
.sum-line{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px}
.warn-text{color:var(--warn);font-weight:600}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.btn,.meter i,.bar .track i{transition:all .2s}}
@media (max-width:600px){.hide-sm{display:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>CareStock</h1><span class="fac" id="facName">Assisted living supply tracker</span></div>
    <div class="top-actions">
      <span class="note" id="whoami" style="align-self:center" hidden></span>
      <button class="btn" id="btnSettings" type="button">Facility settings</button>
      <button class="btn" id="btnScan" type="button" hidden>Scan receipt</button>
      <button class="btn primary" id="btnAdd" type="button">+ Add item</button>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#inventory" data-tab="inventory">Inventory</a>
      <a href="#reorder" data-tab="reorder">Reorder</a>
      <a href="#savings" data-tab="savings">Cost savings</a>
      <a href="#activity" data-tab="activity">Change history</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <div class="status-line" id="status">Loading your inventory…</div>
</main>
<div id="modalRoot"></div>

<script>
(() => {
const CATS = ["Incontinence","Medical supplies","PPE & infection control","Personal care","Nutrition & dietary","Housekeeping & sanitation","Linens","Medication room","Office & admin"];
const STOCK_TYPES = {use:"Used", receive:"Received", waste:"Wasted / expired", count:"Count correction"};
const TYPES = {...STOCK_TYPES, add:"Item added", edit:"Item edited", delete:"Item deleted", settings:"Settings changed"};
const NAMES = {}; let meName="";
function whoName(id){ if(!id) return "Example data"; if(String(id).startsWith("local:")) return String(id).slice(6)+(id===myId?" (you)":""); if(id===myId) return (NAMES[id]||meName||"You")+" (you)"; return NAMES[id]||"Team member"; }
async function loadNames(){
  if(!user) return; const ids=[...new Set([...S.logs.map(l=>l.by),...[...S.items.values()].map(i=>i.updatedBy)].filter(Boolean))].filter(id=>!(id in NAMES));
  if(!ids.length) return;
  try{ for(let i=0;i<ids.length;i+=64){ const ps=await user.profiles(ids.slice(i,i+64)); for(const id of ids.slice(i,i+64)) NAMES[id]=(ps&&ps[id]&&ps[id].name)||""; } render(); }catch{}
}
function lastBought(it){ let t=+it.lastPurchased||0; for(const l of S.logs){ if(l.itemId===it.id&&l.type==="receive"&&l.ts>t) t=l.ts; } return t||null; }
const fmtTs = ts => new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
const S = { items:new Map(), logs:[], settings:{name:"",residents:40,budget:12000,expiryDays:30}, canWrite:true, ready:false, offline:false,
  tab:"overview", q:"", cat:"", status:"", sort:{k:"status",d:1}, logType:"", logWho:"" };
let db=null, user=null, myId=null;

// ---------- helpers ----------
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n,dec) => { n=+n||0; const d = dec ?? (Math.abs(n)<100?2:0); return n.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:d,maximumFractionDigits:d}); };
const fmt = n => (+n||0).toLocaleString("en-US",{maximumFractionDigits:1});
const DAY = 86400000;
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const daysUntil = ds => { if(!ds) return null; const [y,m,d]=ds.split("-").map(Number); const t=new Date(y,m-1,d); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/DAY); };
const fmtDate = ds => { if(!ds) return "—"; const [y,m,d]=ds.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

// ---------- calculations ----------
function usageRate(it){
  const now=Date.now(), since=now-30*DAY;
  const uses=S.logs.filter(l=>l.itemId===it.id && (l.type==="use") && l.ts>=since);
  if(uses.length>=3){
    const first=Math.min(...uses.map(l=>l.ts));
    const span=Math.min(30,Math.max(7,(now-first)/DAY));
    return {rate:uses.reduce((a,l)=>a+(+l.qty||0),0)/span, src:"logged"};
  }
  return {rate:+it.dailyUse||0, src:"estimate"};
}
function statusOf(it){
  const exp=daysUntil(it.expires);
  if(it.expires && exp<0 && it.onHand>0) return "expired";
  if((+it.onHand||0)<=0) return "out";
  if(+it.onHand<=+it.reorderAt) return "low";
  if(it.expires && exp<=(+S.settings.expiryDays||30)) return "expiring";
  if(+it.par>0 && +it.onHand>1.5*+it.par) return "over";
  return "ok";
}
const STATUS_LABEL={out:"Out",low:"Reorder",expired:"Expired",expiring:"Expiring",over:"Overstock",ok:"OK"};
const STATUS_RANK={out:0,expired:1,low:2,expiring:3,over:4,ok:5};
function enrich(it){
  const u=usageRate(it); const days=u.rate>0?(+it.onHand||0)/u.rate:null;
  return {...it, st:statusOf(it), rate:u.rate, rateSrc:u.src, daysLeft:days, value:(+it.onHand||0)*(+it.unitCost||0), expIn:daysUntil(it.expires), bought:lastBought(it)};
}
function all(){ return [...S.items.values()].map(enrich); }
function reorderLines(){
  return all().filter(i=>(+i.onHand||0)<=(+i.reorderAt||0) || i.st==="expired").map(i=>{
    const need=Math.max(0,(+i.par||0)-(i.st==="expired"?0:(+i.onHand||0)));
    const pack=Math.max(1,+i.packSize||1);
    const packs=Math.max(1,Math.ceil(need/pack));
    const units=packs*pack;
    const save=(+i.altCost>0 && +i.altCost<+i.unitCost)? units*(+i.unitCost-+i.altCost):0;
    return {...i, packs, units, cost:units*(+i.unitCost||0), save};
  });
}
function monthStart(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); }
function spendThisMonth(){ const ms=monthStart(); return S.logs.filter(l=>l.type==="receive"&&l.ts>=ms).reduce((a,l)=>a+(+l.qty||0)*(+l.unitCost||0),0); }
function wasteLast30(){ const s=Date.now()-30*DAY; return S.logs.filter(l=>l.type==="waste"&&l.ts>=s).reduce((a,l)=>a+(+l.qty||0)*(+l.unitCost||0),0); }
function monthlyUsageCost(items){ return items.reduce((a,i)=>a+i.rate*30*(+i.unitCost||0),0); }

function opportunities(){
  const items=all(), out=[];
  for(const i of items){
    const monthUnits=i.rate*30;
    if(+i.altCost>0 && +i.altCost<+i.unitCost && monthUnits>0){
      const amt=monthUnits*(+i.unitCost-+i.altCost);
      out.push({kind:"Switch supplier", amt, per:"per month", t:`${i.name}: buy from ${i.altSupplier||"the alternate supplier"}`, d:`${money(i.altCost,2)} vs ${money(i.unitCost,2)} per ${i.unit||"unit"} at about ${fmt(monthUnits)} ${i.unit||"units"} a month. ${Math.round((1-i.altCost/i.unitCost)*100)}% cheaper.`});
    }
    if(i.st==="over"){
      const extra=(+i.onHand)-(+i.par);
      out.push({kind:"Overstock", amt:extra*(+i.unitCost||0), per:"cash on shelf", t:`${i.name}: ${fmt(extra)} ${i.unit||"units"} above par`, d:`Pause orders until stock falls below par${i.daysLeft?` (about ${Math.round(i.daysLeft)} days of supply on hand)`:""}. Overstock ties up cash and storage space.`});
    }
    if(i.expires && i.expIn!=null && i.expIn>=0 && i.expIn<=60 && +i.onHand>0){
      const usable=i.rate*i.expIn; const atRisk=Math.max(0,+i.onHand-usable);
      if(atRisk>0) out.push({kind:"Expiry risk", amt:atRisk*(+i.unitCost||0), per:"likely waste", t:`${i.name}: ${fmt(atRisk)} ${i.unit||"units"} may expire unused`, d:`Lot ${i.lot||"—"} expires ${fmtDate(i.expires)}. Use these first, move them to a higher-use wing, or ask ${i.supplier||"the supplier"} about a return or exchange.`});
    }
    if(+i.par>0 && i.rate>0){
      const parDays=(+i.par)/i.rate;
      if(parDays>45){
        const target=Math.ceil(i.rate*30); const freed=((+i.par)-target)*(+i.unitCost||0);
        if(freed>15) out.push({kind:"Right-size par", amt:freed, per:"one-time cash freed", t:`${i.name}: par covers ${Math.round(parDays)} days`, d:`Lower par from ${fmt(i.par)} to about ${fmt(target)} (30 days of use). Smaller standing stock means less spoilage and less money sitting on shelves.`});
      }
    }
    if(+i.packSize>1 && i.rate>0 && +i.par>0 && (+i.par)<(+i.packSize)*2 && i.rate*30>(+i.packSize)){
      out.push({kind:"Bulk buying", amt:0, per:"ask supplier", t:`${i.name}: you use ${fmt(i.rate*30)} ${i.unit||"units"} a month`, d:`That is more than a full ${i.packSize}-count case monthly. Ask ${i.supplier||"your supplier"} for case or contract pricing; 5–15% discounts are common at this volume.`});
    }
  }
  const s30=Date.now()-30*DAY, wasteBy={};
  S.logs.filter(l=>l.type==="waste"&&l.ts>=s30).forEach(l=>{ const k=l.itemName||"Item"; wasteBy[k]=(wasteBy[k]||0)+(+l.qty||0)*(+l.unitCost||0); });
  Object.entries(wasteBy).forEach(([n,v])=>{ if(v>0) out.push({kind:"Waste", amt:v, per:"lost in 30 days", t:`${n}: ${money(v)} thrown out this month`, d:`Find the cause: expired stock, damaged packaging, or opened and not used. Rotating stock first-expired, first-out usually fixes most of it.`}); });
  return out.sort((a,b)=>b.amt-a.amt);
}

function vOverview(){

    <div class="kpi ${expSoon.length?"alert":""}"><span class="lbl">Expiring ≤ ${S.settings.expiryDays} days</span><span class="val">${expSoon.length}</span><span class="sub">${money(expSoon.reduce((a,i)=>a+i.value,0))} of stock</span></div>
    <div class="kpi"><span class="lbl">Purchases this month</span><span class="val">${money(spend,0)}</span><span class="sub">${budget?`${Math.round(spend/budget*100)}% of ${money(budget,0)} budget · on pace for ${money(proj,0)}`:"Set a budget in facility settings"}</span>${budget?`<div class="meter"><i class="${proj>budget?"over":""}" style="width:${pct}%"></i></div>`:""}</div>
    <div class="kpi"><span class="lbl">Supply cost PRPD</span><span class="val">${money(prpd,2)}</span><span class="sub">per resident per day · ${money(usage,0)}/mo usage</span></div>
  </section>
  <div class="grid2">
    <section class="panel"><h2>Needs attention</h2><p class="hint">Out of stock and expired first, then items running low.</p>
      ${att.length?`<div class="list">${att.map(i=>`<div class="row-att">${pill(i.st)}<div><div class="nm">${esc(i.name)}</div><div class="meta">${fmt(i.onHand)} ${esc(i.unit)} on hand · ${i.st==="expired"||i.st==="expiring"?`expires ${fmtDate(i.expires)}`:i.daysLeft!=null?`about ${Math.max(0,Math.floor(i.daysLeft))} days left`:`reorder at ${fmt(i.reorderAt)}`} · ${esc(i.location||"")}</div></div>${S.canWrite?`<button class="btn sm" type="button" data-act="adjust" data-id="${i.id}" data-type="${i.st==="expired"?"waste":"receive"}">${i.st==="expired"?"Log waste":"Receive"}</button>`:""}</div>`).join("")}</div>`:`<div class="empty"><b>All clear</b>Nothing is low, out, or close to expiring.</div>`}
    </section>

}

function vSavings(){
  const ops=opportunities();
  const monthly=ops.filter(o=>o.per==="per month").reduce((a,o)=>a+o.amt,0);
  const cash=ops.filter(o=>o.per==="cash on shelf"||o.per==="one-time cash freed").reduce((a,o)=>a+o.amt,0);
  const risk=ops.filter(o=>o.per==="likely waste"||o.per==="lost in 30 days").reduce((a,o)=>a+o.amt,0);
  return `
  <section class="kpis">
    <div class="kpi"><span class="lbl">Supplier switches</span><span class="val" style="color:var(--ok)">${money(monthly,0)}</span><span class="sub">possible savings per month · ${money(monthly*12,0)} a year</span></div>

    <div class="kpi ${risk?"alert":""}"><span class="lbl">Waste &amp; expiry risk</span><span class="val">${money(risk,0)}</span><span class="sub">likely lost to expiry or already wasted</span></div>
  </section>
  <section class="panel"><h2>Where to save, biggest first</h2><p class="hint">Recalculated live from your stock, prices, expiry dates and usage log. Add an alternate supplier price to items to find more.</p>
  ${ops.length?`<div class="opps">${ops.map(o=>`<div class="opp"><span class="tag">${o.kind}</span><div><div class="t">${esc(o.t)}</div><div class="d">${esc(o.d)}</div></div><div class="amt">${o.amt?money(o.amt,0):"—"}<small>${o.per}</small></div></div>`).join("")}</div>`:`<div class="empty"><b>No savings flagged right now</b>Prices, par levels and expiry dates all look healthy.</div>`}
  </section>

  <ul class="note" style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px">
    <li>Count high-cost items (briefs, nutrition supplements, wound care) weekly, everything else monthly.</li>

  </tbody></table></div>`;
}

      const data={ name:$("#i_name").value.trim(), category:$("#i_cat").value, unit:$("#i_unit").value.trim()||"each", onHand:num("#i_onHand"), packSize:Math.max(1,Math.round(num("#i_pack"))||1), par:num("#i_par"), reorderAt:num("#i_reorder"), unitCost:num("#i_cost"), dailyUse:num("#i_daily"), supplier:$("#i_sup").value.trim(), location:$("#i_loc").value.trim(), altSupplier:$("#i_alts").value.trim(), altCost:num("#i_altc"), lot:$("#i_lot").value.trim(), expires:$("#i_exp").value, updatedAt:Date.now() };
      if(!data.name) return;
      if(data.reorderAt>data.par && data.par>0){ $("#i_hint").textContent="Reorder point should be lower than par level."; return; }
      try{
        if(id){ const prev=S.items.get(id);
          const LBL={name:"Name",category:"Category",unit:"Unit",packSize:"Units per case",par:"Par",reorderAt:"Reorder point",unitCost:"Unit cost",dailyUse:"Daily use",supplier:"Supplier",location:"Location",altSupplier:"Alt supplier",altCost:"Alt cost",lot:"Lot",expires:"Expires"};
          const diffs=Object.keys(LBL).filter(k=>String(prev[k]??"")!==String(data[k]??"")).map(k=>`${LBL[k]}: ${prev[k]===""||prev[k]==null?"—":prev[k]} → ${data[k]===""?"—":data[k]}`);
          await saveItem(id,{...prev,...data,sample:false});
          if(+prev.onHand!==data.onHand) await addLog({itemId:id,itemName:data.name,type:"count",qty:data.onHand-(+prev.onHand||0),unitCost:data.unitCost,note:`On hand ${fmt(prev.onHand)} → ${fmt(data.onHand)} (edited)`});
          if(diffs.length) await addLog({itemId:id,itemName:data.name,type:"edit",qty:0,unitCost:data.unitCost,note:diffs.join("; ")});
        } else { const nid=newId(); await saveItem(nid,{...data,createdAt:Date.now()}); await addLog({itemId:nid,itemName:data.name,type:"add",qty:data.onHand,unitCost:data.unitCost,note:`Starting count ${fmt(data.onHand)} ${data.unit} · par ${fmt(data.par)} · ${money(data.unitCost,2)} each`}); }
        closeModal(); toast(id?"Item saved":"Item added");
      }catch(err){ writeErr(err); }
    });
    const del=$("#btnDel"); if(del){ del.addEventListener("click",async()=>{ if(!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent="Confirm delete"; return; } try{ const prev=S.items.get(id); await removeItem(id); await addLog({itemId:id,itemName:prev.name,type:"delete",qty:0,unitCost:+prev.unitCost||0,note:`Removed with ${fmt(prev.onHand)} ${prev.unit} on hand`}); closeModal(); toast("Item deleted"); }catch(err){ writeErr(err);} }); }
  });
}

function adjustForm(id,type){

    <div class="seg full" role="radiogroup" aria-label="Type">${Object.entries(TYPES).map(([k,v])=>`<label><input type="radio" name="t" value="${k}" ${k===type?"checked":""}><span>${v}</span></label>`).join("")}</div>
    ${fld("a_qty",`<span id="a_qlbl">Quantity</span> <small>(${esc(it.unit)})</small>`,type==="receive"?Math.max(0,(+it.par||0)-(+it.onHand||0))||"":"","number","step=any min=0 required")}
    ${fld("a_cost","Unit cost paid ($)",it.unitCost,"number","step=0.01 min=0")}

    <div class="modal-acts full"><button class="btn" type="button" data-close="1">Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>`, ()=>{
    const cur=()=>document.querySelector('input[name="t"]:checked').value;
    const upd=()=>{ const t=cur(), q=+$("#a_qty").value||0; $("#a_qlbl").textContent=t==="count"?"Actual count on shelf":"Quantity";
      $("#a_cost").closest("label").hidden=t!=="receive";
      const next=t==="receive"?+it.onHand+q:t==="count"?q:Math.max(0,+it.onHand-q);
      $("#a_prev").textContent=`On hand will be ${fmt(next)} ${it.unit}.`+(t==="count"&&q!==+it.onHand?` Difference: ${q-it.onHand>0?"+":""}${fmt(q-it.onHand)}.`:"")+(t==="receive"&&+$("#a_cost").value&&+$("#a_cost").value!==+it.unitCost?" The item's unit cost will update to this price.":""); };
    document.querySelectorAll('input[name="t"]').forEach(r=>r.addEventListener("change",upd)); $("#a_qty").addEventListener("input",upd); $("#a_cost").addEventListener("input",upd); upd();
    $("#adjForm").addEventListener("submit",async e=>{
      e.preventDefault(); const t=cur(), q=+$("#a_qty").value; if(!(q>=0)) return;

      const prev=S.items.get(id); let next, qty;
      if(t==="receive"){ next=+prev.onHand+q; qty=q; } else if(t==="count"){ next=q; qty=q-(+prev.onHand||0); } else { qty=Math.min(q,+prev.onHand||0); next=(+prev.onHand||0)-qty; }
      try{
        await saveItem(id,{...prev,onHand:next,unitCost:cost,updatedAt:Date.now(),...(t==="receive"?{lastPurchased:Date.now()}:{})});
        await addLog({itemId:id,itemName:prev.name,type:t,qty,unitCost:cost,note:$("#a_note").value.trim()});
        closeModal(); toast(`${TYPES[t]}: ${fmt(Math.abs(qty))} ${prev.unit}`);
      }catch(err){ writeErr(err); }
    });
  });
}

// ---------- receipt scanning ----------
let sampleFn=null, imgLimits=null, assetsNs=null, scanFiles=[], scanCtl=null;
function scanForm(){
  scanFiles=[];
  openModal(`<h3>Scan a receipt</h3>
  <p class="note" style="margin:-6px 0 0">Photograph the receipt, invoice or packing slip, or upload a picture of it (up to ${imgLimits.maxCount} pages). Claude reads every line and matches it to your items. You check everything before it's saved.</p>
  <div class="toolbar">
    <label class="btn primary" for="r_cam">Take photo</label><input class="vh" id="r_cam" type="file" accept="image/*" capture="environment">
    <label class="btn" for="r_file">Upload image</label><input class="vh" id="r_file" type="file" accept="${esc(imgLimits.mediaTypes.join(","))}" multiple>
  </div>
  <div id="r_thumbs" class="thumbs"></div>
  <p class="note" id="r_status">Tip: lay the receipt flat in good light so every line is readable.</p>
  <div class="modal-acts"><button class="btn" type="button" data-close="1" id="r_cancel">Cancel</button><button class="btn" type="button" id="r_stop" hidden>Stop</button><button class="btn primary" type="button" id="r_go" disabled>Read receipt</button></div>`, ()=>{
    const thumbs=()=>{ $("#r_thumbs").innerHTML=scanFiles.map((f,i)=>`<figure><img alt="Receipt page ${i+1}" src="${f._url}"><button type="button" data-rm="${i}" aria-label="Remove page ${i+1}">×</button></figure>`).join(""); $("#r_go").disabled=!scanFiles.length; };
    const addFiles=list=>{ for(const f of list){ if(scanFiles.length>=imgLimits.maxCount){ $("#r_status").textContent=`Up to ${imgLimits.maxCount} pages per receipt.`; break; } if(f.size>imgLimits.maxInputBytes){ $("#r_status").textContent=`${f.name} is too large. Try a smaller photo.`; continue; } f._url=URL.createObjectURL(f); scanFiles.push(f); } thumbs(); };
    $("#r_cam").addEventListener("change",e=>{ addFiles(e.target.files); e.target.value=""; });
    $("#r_file").addEventListener("change",e=>{ addFiles(e.target.files); e.target.value=""; });
    $("#r_thumbs").addEventListener("click",e=>{ const b=e.target.closest("[data-rm]"); if(!b) return; scanFiles.splice(+b.dataset.rm,1); thumbs(); });
    $("#r_stop").addEventListener("click",()=>scanCtl&&scanCtl.abort());
    $("#r_go").addEventListener("click",readReceipt);
  });
}
async function readReceipt(){
  const st=$("#r_status"), go=$("#r_go"), stop=$("#r_stop");
  go.disabled=true; stop.hidden=false; st.textContent="Reading the receipt… this usually takes 20–60 seconds.";
  scanCtl=new AbortController();
  const catalog=[...S.items.values()].map(i=>({id:i.id,name:i.name,unit:i.unit,unitsPerCase:+i.packSize||1,supplier:i.supplier||""}));
  const prompt=`The attached image${scanFiles.length>1?`s are ${scanFiles.length} pages of ONE`:" is a"} supply receipt, invoice or packing slip for an assisted living facility.
Extract every purchased product line. Do not list subtotal, tax, shipping, fees, discounts or payment lines as products; report tax, shipping and totals in their own fields.
Match each line to the facility's catalog below when it is clearly the same product (watch sizes such as M vs L). Use "matchId": null when it is not in the catalog or you are unsure.
"qty" must be in the matched catalog item's count unit: if the receipt counts cases/boxes/packs and the catalog unit is smaller, multiply by the pack count printed on the receipt, or else by the catalog's unitsPerCase. "unitCost" is the price per that count unit. For unmatched lines, use the receipt's own unit.
"category" must be one of: ${CATS.join(", ")}.
Catalog: ${JSON.stringify(catalog)}
Reply with only JSON in exactly this shape:
{"supplier":"string or null","date":"YYYY-MM-DD or null","invoice":"string or null","subtotal":0,"tax":0,"shipping":0,"total":0,"lines":[{"description":"product as printed","receiptQty":2,"receiptUnit":"case","qty":160,"unit":"each","unitCost":0.62,"lineTotal":99.2,"matchId":"brief-m","category":"Incontinence","confidence":"high"}]}
Use null for any number you cannot read. "confidence" is high, medium or low.`;
  try{
    const out=await sampleFn.json(prompt,{images:scanFiles,signal:scanCtl.signal,onText:()=>{ st.textContent="Almost done, organizing the line items…"; }});
    if(!out||!Array.isArray(out.lines)||!out.lines.length){ st.textContent="No product lines were found. Try a clearer, closer photo."; go.disabled=false; stop.hidden=true; return; }
    reviewReceipt(out);
  }catch(e){
    stop.hidden=true; go.disabled=false;
    const msg={cancelled:"Stopped.",not_granted:"Claude wasn't allowed to read images on this page. You can allow it from the page's permissions and try again.",rate_limited:"Too many requests right now. Wait a minute and try again.",image_rejected:"That image couldn't be read. Use a JPEG or PNG photo under the size limit.",refused:"Claude couldn't process this image. Try a different photo.",invalid_json:"The receipt was hard to read. Try a sharper photo, or one page at a time.",session_expired:"Your session expired. Sign in again, then retry."}[e&&e.code];
    st.textContent=msg||"Something went wrong reading the receipt. Try again.";
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="images_unavailable")) go.disabled=true;
  }
}
function reviewReceipt(r){
  const items=[...S.items.values()].sort((a,b)=>a.name.localeCompare(b.name));
  const lines=r.lines.map((l,ix)=>{ const m=l.matchId&&S.items.has(String(l.matchId))?String(l.matchId):"__new";
    return {ix, desc:String(l.description||"Item").slice(0,80), rq:l.receiptQty, ru:l.receiptUnit||"", qty:Math.max(0,+l.qty||+l.receiptQty||0), unit:String(l.unit||l.receiptUnit||"each").slice(0,20), cost:Math.max(0,+l.unitCost||0), match:m, cat:CATS.includes(l.category)?l.category:CATS[0], conf:l.confidence||"medium", inc:true}; });
  const sup=r.supplier||"", date=/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:todayStr();
  const rowHtml=l=>`<tr data-ix="${l.ix}" class="${l.inc?"":"skip"}">
    <td><input type="checkbox" class="rv-inc" ${l.inc?"checked":""} aria-label="Include ${esc(l.desc)}"></td>
    <td><b>${esc(l.desc)}</b><span class="sub">${l.rq!=null?`Receipt: ${fmt(l.rq)} ${esc(l.ru)}`:""}${l.conf==="low"?` · <span class="warn-text">check this line</span>`:""}</span></td>
    <td><select class="rv-match" aria-label="Match for ${esc(l.desc)}"><option value="__new" ${l.match==="__new"?"selected":""}>+ Create new item</option>${items.map(i=>`<option value="${i.id}" ${l.match===i.id?"selected":""}>${esc(i.name)}</option>`).join("")}</select>
      <select class="rv-cat" aria-label="Category" ${l.match==="__new"?"":"hidden"} style="margin-top:4px">${CATS.map(c=>`<option ${l.cat===c?"selected":""}>${c}</option>`).join("")}</select></td>
    <td class="r"><input type="number" class="rv-qty" min="0" step="any" value="${l.qty}" aria-label="Quantity"><span class="sub rv-unit">${esc(l.match==="__new"?l.unit:S.items.get(l.match).unit)}</span></td>
    <td class="r"><input type="number" class="rv-cost" min="0" step="0.01" value="${l.cost}" aria-label="Unit cost"></td>
    <td class="r num rv-tot">${money(l.qty*l.cost,2)}</td></tr>`;
  openModal(`<h3>Review receipt</h3>
  <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    ${fld("rv_sup","Supplier",sup,"text","maxlength=60")}${fld("rv_date","Purchase date",date,"date")}${fld("rv_inv","Invoice / receipt #",r.invoice||"","text","maxlength=40")}
  </div>
  <div class="tbl-frame rv"><table><thead><tr><th></th><th>On receipt</th><th>Add to item</th><th class="r">Qty (units)</th><th class="r">Unit cost</th><th class="r">Line total</th></tr></thead><tbody>${lines.map(rowHtml).join("")}</tbody></table></div>
  <div class="sum-line"><span>Lines selected: <b id="rv_n"></b></span><span>Products total: <b class="num" id="rv_tot"></b></span>${r.subtotal!=null||r.total!=null?`<span>Receipt ${r.subtotal!=null?"subtotal":"total"}: <b class="num">${money(r.subtotal??r.total,2)}</b></span>`:""}<span id="rv_chk"></span></div>
  ${r.tax||r.shipping?`<p class="note" style="margin:0">Tax ${money(r.tax||0,2)} and shipping ${money(r.shipping||0,2)} are not added to item costs.</p>`:""}
  <label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rv_upd" checked style="width:auto"> Update each item's unit cost to the price on this receipt</label>
  <div class="modal-acts"><button class="btn" type="button" data-close="1">Cancel</button><button class="btn primary" type="button" id="rv_go">Add to inventory</button></div>`, m=>{
    const refsub=r.subtotal??r.total;
    const recalc=()=>{ let n=0,t=0; lines.forEach(l=>{ if(l.inc){ n++; t+=l.qty*l.cost; } }); $("#rv_n").textContent=n; $("#rv_tot").textContent=money(t,2);
      $("#rv_chk").innerHTML= refsub!=null&&Math.abs(t-refsub)>Math.max(1,refsub*.02)&&lines.every(l=>l.inc)?`<span class="warn-text">Doesn't match the receipt by ${money(Math.abs(t-refsub),2)}. Check quantities and prices.</span>`:""; $("#rv_go").disabled=!n; };
    m.querySelector("tbody").addEventListener("input",e=>{ const tr=e.target.closest("tr"); const l=lines[+tr.dataset.ix];
      if(e.target.classList.contains("rv-qty")) l.qty=Math.max(0,+e.target.value||0);
      if(e.target.classList.contains("rv-cost")) l.cost=Math.max(0,+e.target.value||0);
      tr.querySelector(".rv-tot").textContent=money(l.qty*l.cost,2); recalc(); });
    m.querySelector("tbody").addEventListener("change",e=>{ const tr=e.target.closest("tr"); const l=lines[+tr.dataset.ix];
      if(e.target.classList.contains("rv-inc")){ l.inc=e.target.checked; tr.classList.toggle("skip",!l.inc); }
      if(e.target.classList.contains("rv-match")){ l.match=e.target.value; tr.querySelector(".rv-cat").hidden=l.match!=="__new"; tr.querySelector(".rv-unit").textContent=l.match==="__new"?l.unit:S.items.get(l.match).unit; }
      if(e.target.classList.contains("rv-cat")) l.cat=e.target.value;
      recalc(); });
    recalc();
    $("#rv_go").addEventListener("click",async()=>{
      const b=$("#rv_go"); b.disabled=true; b.textContent="Saving…";
      const supplier=$("#rv_sup").value.trim(), pdate=$("#rv_date").value||todayStr(), inv=$("#rv_inv").value.trim(), upd=$("#rv_upd").checked;
      const [y,mo,d]=pdate.split("-").map(Number); const pts=new Date(y,mo-1,d,12).getTime();
      let receiptIds=[]; if(assetsNs){ for(const f of scanFiles){ try{ const a=await assetsNs.upload(f); receiptIds.push(a.id); }catch{} } }
      const note=`Receipt${inv?` #${inv}`:""}${supplier?` · ${supplier}`:""} · purchased ${fmtDate(pdate)}`;
      let done=0;
      try{
        for(const l of lines.filter(l=>l.inc&&l.qty>0)){
          if(l.match!=="__new"){ const prev=S.items.get(l.match);
            await saveItem(l.match,{...prev,onHand:(+prev.onHand||0)+l.qty,unitCost:upd&&l.cost?l.cost:prev.unitCost,lastPurchased:Math.max(pts,+prev.lastPurchased||0),supplier:prev.supplier||supplier});
            await addLog({itemId:l.match,itemName:prev.name,type:"receive",qty:l.qty,unitCost:l.cost||+prev.unitCost||0,note,purchaseDate:pdate,receiptIds});
          } else { const nid=newId();
            await saveItem(nid,{name:l.desc,category:l.cat,unit:l.unit,packSize:1,onHand:l.qty,par:l.qty,reorderAt:Math.max(1,Math.round(l.qty*.3)),unitCost:l.cost,dailyUse:0,supplier,location:"",altSupplier:"",altCost:0,lot:"",expires:"",lastPurchased:pts,createdAt:Date.now()});
            await addLog({itemId:nid,itemName:l.desc,type:"add",qty:0,unitCost:l.cost,note:"Created from scanned receipt. Set par, reorder point and location."});
            await addLog({itemId:nid,itemName:l.desc,type:"receive",qty:l.qty,unitCost:l.cost,note,purchaseDate:pdate,receiptIds});
          }
          done++;
        }
        scanFiles.forEach(f=>URL.revokeObjectURL(f._url)); closeModal(); toast(`${done} line${done===1?"":"s"} added from receipt`);
      }catch(err){ writeErr(err); }
    });
  }, true);
}

const LS_KEY="carestock-data-v1", LS_WHO="carestock-who";
let localSeq=0, LOCAL=false;
const newId=()=> db? db.collection("items").doc().id : "i"+Date.now().toString(36)+(++localSeq);
function persistLocal(){ if(!LOCAL) return true;
  try{ localStorage.setItem(LS_KEY,JSON.stringify({v:1,items:[...S.items.values()],logs:S.logs.slice(0,3000),settings:S.settings})); return true; }

async function saveItem(id,data){ const clean={...data,updatedAt:Date.now(),updatedBy:myId||""}; delete clean.id; if(db) await db.doc("items/"+id).set(clean); else { S.items.set(id,{...clean,id}); persistLocal(); render(); } }

plier":"Costco Business","altCost":1.35,"lot":"NS-8812","expires":"2026-12-05"},{"id":"thickener","name":"Thickening powder (nectar)","category":"Nutrition & dietary","unit":"can","packSize":12,"onHand":9,"par":24,"reorderAt":8,"unitCost":11.5,"dailyUse":0.6,"supplier":"Sysco","location":"Kitchen dry storage","altSupplier":"","altCost":0,"lot":"TH-0447","expires":"2026-11-28"},{"id":"towels","name":"Bath towels","category":"Linens","unit":"each","packSize":12,"onHand":140,"par":120,"reorderAt":60,"unitCost":4.8,"dailyUse":0.6,"supplier":"Standard Textile","location":"Linen room","altSupplier":"","altCost":0,"lot":"","expires":""},{"id":"underpad","name":"Disposable underpads 30x36","category":"Incontinence","unit":"each","packSize":150,"onHand":620,"par":300,"reorderAt":120,"unitCost":0.21,"dailyUse":8,"supplier":"McKesson","location":"Supply room A, shelf 2","altSupplier":"","altCost":0,"lot":"","expires":""},{"id":"wipes","name":"Adult washcloths / wipes","category":"Personal care","unit":"pack","packSize":48,"onHand":40,"par":96,"reorderAt":40,"unitCost":3.1,"dailyUse":3.2,"supplier":"Medline","location":"Supply room A, shelf 3","altSupplier":"Amazon Business","altCost":2.65,"lot":"","expires":""}];
function buildSample(){
  const now=Date.now(); let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const items=new Map(SAMPLE_ITEMS.map(i=>[i.id,{...i,sample:true,createdAt:now-35*DAY,updatedAt:now,updatedBy:""}]));
  const logs=[]; let k=0; const notes=["Wing A day shift","Wing B night shift","Memory care","Wing A evening",""];
  const add=(iid,type,qty,ts,note)=>{ const it=items.get(iid); logs.push({id:"s"+(++k),ts,itemId:iid,itemName:it.name,type,qty,unitCost:it.unitCost,note,by:"",sample:true}); };
  for(let d=26;d>0;d-=2) for(const iid of ["brief-m","brief-l","wipes","gloves-m","supplement","underpad"]){ const it=items.get(iid); add(iid,"use",Math.max(1,Math.round(it.dailyUse*2*(0.8+rnd()*0.45)*(iid==="brief-m"?1.15:1))),now-d*DAY-Math.floor(rnd()*8)*3600000,notes[Math.floor(rnd()*notes.length)]); }
  add("brief-m","receive",480,now-9*DAY,"Invoice MD-20914"); add("brief-l","receive",432,now-9*DAY,"Invoice MD-20914");
  add("gloves-m","receive",30,now-5*DAY,"Invoice MK-55102"); add("supplement","receive",192,now-6*DAY,"Sysco delivery");
  add("bleachwipes","receive",18,now-3*DAY,"Grainger order 7731"); add("thickener","waste",3,now-4*DAY,"Expired lot TH-0391");
  add("supplement","waste",12,now-2*DAY,"Opened, not refrigerated"); add("barrier","count",-2,now-1*DAY,"Monthly count"); add("paper","receive",20,now-1*DAY,"Staples order");
  logs.sort((a,b)=>b.ts-a.ts);
  // Example expiry dates stay relative to today so the alerts always demonstrate.
  const rel=n=>{ const t=new Date(now+n*DAY); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
  items.get("thickener").expires=rel(18); items.get("supplement").expires=rel(26); items.get("barrier").expires=rel(-10); items.get("sanitizer").expires=rel(55);
  return {items,logs,settings:{name:"Sample Facility (example)",residents:42,budget:9500,expiryDays:30}};
}
function loadLocal(){
  let data=null; try{ data=JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch{}
  if(data&&Array.isArray(data.items)){ S.items=new Map(data.items.map(i=>[i.id,i])); S.logs=Array.isArray(data.logs)?data.logs:[]; S.settings={...S.settings,...(data.settings||{})}; }
  else { const s=buildSample(); S.items=s.items; S.logs=s.logs; S.settings=s.settings; persistLocal(); }
  let who=""; try{ who=localStorage.getItem(LS_WHO)||""; }catch{}
  setLocalWho(who);
}
function setLocalWho(name){ meName=name; myId=name?"local:"+name:null; if(myId) NAMES[myId]=name;

function backupJson(){ return JSON.stringify({app:"CareStock",v:1,exportedAt:new Date().toISOString(),items:[...S.items.values()],logs:S.logs,settings:S.settings},null,1); }
async function restoreBackup(file){
  try{ const d=JSON.parse(await file.text()); if(!d||d.app!=="CareStock"||!Array.isArray(d.items)) throw 0;
    S.items=new Map(d.items.map(i=>[i.id,i])); S.logs=Array.isArray(d.logs)?d.logs:[]; S.settings={...S.settings,...(d.settings||{})};
    persistLocal(); await addLog({itemId:"",itemName:"",type:"settings",qty:0,unitCost:0,note:`Restored backup from ${d.exportedAt?fmtTs(Date.parse(d.exportedAt)):"file"} (${d.items.length} items)`});
    closeModal(); render(); toast("Backup restored");
  }catch{ toast("That file isn't a CareStock backup."); } }
function writeErr(err){
  if(err?.code==="invalid_argument"){ S.canWrite=false; closeModal(); render(); toast("You don't have permission to change this inventory."); }
  else if(err?.code==="quota_exceeded") toast("Storage is full. Delete old activity or unused items, then try again.");
  else toast("Couldn't save. Check your connection and try again.");
}

// ---------- exports ----------
const csv=rows=>rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\n");
async function download(name,text,type){
  if(!window.claude){ const url=URL.createObjectURL(new Blob([text],{type:type||"text/csv"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); return; }
  try{ const dl=await claude.use("downloads"); if(!dl) throw 0; await dl.save({filename:name,data:new Blob([text],{type:"text/csv"})}); }
  catch(e){ if(e&&e.code) { if(e.code!=="declined"&&e.code!=="cancelled") toast("Download didn't start."); } else { try{ await navigator.clipboard.writeText(text); toast("Downloads aren't available here, so the CSV was copied instead."); }catch{ toast("Downloads aren't available in this view."); } } }
}

// ---------- events ----------
document.addEventListener("click",async e=>{
  const c=e.target.closest("[data-close]"); if(c && (e.target===c || c.tagName==="BUTTON")){ closeModal(); return; }
  const th=e.target.closest("th[data-sort]"); if(th){ const k=th.dataset.sort; S.sort = S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==="value"?-1:1}; render(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="switchWho") whoForm(false);
  if(a==="backup") download(`carestock-backup-${todayStr()}.json`,backupJson(),"application/json");
  if(a==="edit") itemForm(b.dataset.id);
  if(a==="adjust") adjustForm(b.dataset.id,b.dataset.type);
  if(a==="csvInv"){ const r=[["Item","Category","Unit","On hand","Par","Reorder point","Units per case","Unit cost","Value","Daily use","Days left","Supplier","Alt supplier","Alt cost","Location","Lot","Expires","Status"]]; all().forEach(i=>r.push([i.name,i.category,i.unit,i.onHand,i.par,i.reorderAt,i.packSize,(+i.unitCost).toFixed(2),i.value.toFixed(2),i.rate.toFixed(2),i.daysLeft==null?"":Math.floor(i.daysLeft),i.supplier,i.altSupplier,i.altCost||"",i.location,i.lot,i.expires,STATUS_LABEL[i.st]])); download(`inventory-${todayStr()}.csv`,csv(r)); }
  if(a==="csvOrder"){ const r=[["Supplier","Item","Cases","Units per case","Units","Unit cost","Est. cost"]]; reorderLines().forEach(l=>r.push([l.supplier,l.name,l.packs,l.packSize||1,l.units,(+l.unitCost).toFixed(2),l.cost.toFixed(2)])); download(`reorder-${todayStr()}.csv`,csv(r)); }
  if(a==="csvLog"){ const r=[["Date & time","Changed by","Item","What happened","Qty","Unit cost","Details"]]; S.logs.forEach(l=>r.push([fmtTs(l.ts),whoName(l.by),l.itemName,TYPES[l.type]||l.type,l.qty,l.unitCost,l.note])); download(`activity-${todayStr()}.csv`,csv(r)); }
  if(a==="copyOrder"){ const by={}; reorderLines().forEach(l=>(by[l.supplier||"No supplier set"] ||= []).push(l));
    const txt=`Supply order — ${S.settings.name||"Facility"} — ${fmtDate(todayStr())}\n\n`+Object.entries(by).map(([s,ls])=>`${s}\n`+ls.map(l=>`  • ${l.name}: ${l.packs} case(s) × ${l.packSize||1} = ${l.units} ${l.unit}  (~${money(l.cost,2)})`).join("\n")+`\n  Subtotal: ${money(ls.reduce((a,l)=>a+l.cost,0),2)}`).join("\n\n");
    try{ await navigator.clipboard.writeText(txt); toast("Order list copied"); }catch{ openModal(`<h3>Order list</h3><textarea rows="14" readonly id="ordTxt">${esc(txt)}</textarea><div class="modal-acts"><button class="btn" type="button" data-close="1">Close</button></div>`,()=>$("#ordTxt").select()); } }
  if(a==="receiveAll"){ const sup=b.dataset.sup; const ls=reorderLines().filter(l=>(l.supplier||"No supplier set")===sup);
    if(!b.classList.contains("armed")){ b.classList.add("armed","primary"); b.textContent=`Confirm: add ${ls.length} deliveries`; return; }
    b.disabled=true; try{ for(const l of ls){ const prev=S.items.get(l.id); const base=l.st==="expired"?0:+prev.onHand; await saveItem(l.id,{...prev,onHand:base+l.units,updatedAt:Date.now(),lastPurchased:Date.now()}); await addLog({itemId:l.id,itemName:prev.name,type:"receive",qty:l.units,unitCost:+prev.unitCost,note:`Order from ${sup}`}); } toast(`${ls.length} items received`); }catch(err){ writeErr(err); } }
  if(a==="clearSample"){ if(!b.classList.contains("armed")){ b.classList.add("armed","danger"); b.textContent="Confirm: delete all examples"; return; }
    b.disabled=true; if(LOCAL){ for(const it of [...S.items.values()].filter(i=>i.sample)) S.items.delete(it.id); S.logs=S.logs.filter(l=>!l.sample); S.settings={...S.settings,name:S.settings.name==="Sample Facility (example)"?"":S.settings.name}; persistLocal(); render(); toast("Examples cleared"); return; }
    try{ for(const it of [...S.items.values()].filter(i=>i.sample)) await db.doc("items/"+it.id).delete(); for(const l of S.logs.filter(l=>l.sample)) await db.doc("logs/"+l.id).delete(); toast("Examples cleared"); }catch(err){ writeErr(err); } }
});

const TABS=["overview","inventory","reorder","savings","activity"];
function route(){ const h=location.hash.slice(1); S.tab=TABS.includes(h)?h:"overview"; try{ localStorage.setItem("cs-tab",S.tab);}catch{} render(); }

// ---------- boot ----------
async function boot(){
  if(!location.hash){ try{ const t=localStorage.getItem("cs-tab"); if(TABS.includes(t)) S.tab=t; }catch{} } else route();
  render();
  db = window.claude ? await claude.use("db").catch(()=>null) : null;
  if(db) LOCAL=false;
  user = window.claude ? await claude.use("user").catch(()=>null) : null;
  if(user){ try{ myId=await user.id(); }catch{} try{ const w=await user.can("data.write"); if(w===false) S.canWrite=false; }catch{}
    try{ const me=await user.me(); meName=(me&&me.name)||""; }catch{}
    try{ S.isOwner=!!(await user.isOwner()); }catch{}
    const w=$("#whoami"); if(myId){ w.textContent=`Signed in as ${meName||"you"}${S.isOwner?" · owner":""}`; w.hidden=false; } }
  if(window.claude) try{ sampleFn=await claude.use("sample"); if(sampleFn){ const lim=await sampleFn.limits().catch(()=>null); imgLimits=lim&&lim.images||null; } }catch{}
  if(window.claude) try{ assetsNs=await claude.use("assets"); }catch{ assetsNs=null; }
  $("#btnScan").hidden=!(sampleFn&&imgLimits&&S.canWrite);
  $("#btnScan").addEventListener("click",scanForm);
  if(!db){
    try{ localStorage.setItem("cs-probe","1"); localStorage.removeItem("cs-probe"); LOCAL=true; }catch{ LOCAL=false; }
    if(LOCAL) loadLocal(); else { const s=buildSample(); S.items=s.items; S.logs=s.logs; S.settings=s.settings; }
    S.ready=true; render(); if(LOCAL && !meName) whoForm(true); return; }
  let got={items:false,logs:false};
  const timer=setTimeout(()=>{ if(!S.ready){ S.offline=true; render(); } },10000);
  const check=()=>{ if(got.items&&got.logs&&!S.ready){ S.ready=true; S.offline=false; clearTimeout(timer); } render(); };
  db.collection("items").onSnapshot(snap=>{ S.items=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); if(!snap.metadata.fromCache) got.items=true; check(); }, ()=>{ got.items=true; check(); });
  db.collection("logs").orderBy("ts","desc").limit(1000).onSnapshot(snap=>{ S.logs=snap.docs.map(d=>({...d.data(),id:d.id})); if(!snap.metadata.fromCache) got.logs=true; check(); loadNames(); }, ()=>{ got.logs=true; check(); });
  db.doc("settings/facility").onSnapshot(s=>{ if(s.exists) S.settings={...S.settings,...s.data()}; render(); }, ()=>{});
}
boot();
})();
